<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>31-Filters</title>
    <link rel="stylesheet" href="../src/css/master.css" />
    <style>
      section {
        img.filter {
          outline: 2px solid #fff;
          corner-shape: squircle;
          background: linear-gradient(45deg, red, blue);
          padding: 0.4rem;
          border-radius: 14px;
          display: block;
          margin: 1rem auto;
          transition: all 0.2s ease-in;
          width: 140px;

          &.filter1 {
            filter: grayscale(1);
          }

          &.filter2 {
            filter: blur(3px);
          }
          &.filter3 {
            filter: sepia(1);

          }
          &.filter4 {
            filter: brightness(1.5);
          }

          &.filter5 {
            filter: invert(1);
          }

          &.filter6 {
            filter: drop-shadow(0px 0px 12px #fff);
          }

          &.filter7 {
            filter: hue-rotate(150deg);
          }

          &:hover {
            filter: none;
          }
        }
      }
    </style>
  </head>

  <body class="css">
    <a href="index.html" class="btn-home">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="32"
        height="32"
        fill="#000000"
        viewBox="0 0 256 256"
      >
        <path
          d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"
        ></path>
      </svg>
    </a>
    <main>
      <header>
        <h1 class="mainmenu">31-Filters</h1>
        <h4>Property (filter) applying graphical transformations (e.g., blur(), grayscale(), contrast(), drop-shadow()) to elements before display.</h4>
      </header>
      <section>
        <h4>GrayScale</h4>
        <img class="filter filter1" src="imgs/inosuke.png" alt="Inosuke" />
        <h4>Blur</h4>
        <img class="filter filter2" src="imgs/inosuke.png" alt="Inosuke" />
        <h4>Sepia</h4>
        <img class="filter filter3" src="imgs/inosuke.png" alt="Inosuke" />
        <h4>Brightness</h4>
        <img class="filter filter4" src="imgs/inosuke.png" alt="Inosuke" />
        <h4>Invert</h4>
        <img class="filter filter5" src="imgs/inosuke.png" alt="Inosuke" />
        <h4>Drop Shadow</h4>
        <img class="filter filter6" src="imgs/inosuke.png" alt="Inosuke" />
        <h4>HUE Rotate</h4>
        <img class="filter filter7" src="imgs/inosuke.png" alt="Inosuke" />
      </section>
    </main>
  </body>
</html>
