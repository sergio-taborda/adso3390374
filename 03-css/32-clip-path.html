<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32-Clip-Path</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            div.clip {
            background: url(imgs/pittsburgh.jpg) no-repeat
                        center /cover;
            border-radius: 14px;
            corner-shape: squircle;
            margin: 0 auto;
            height: 300px;
            transition: all 0.4s ease-in;
            width: 300px;

            &.clip1 {
                clip-path: polygon(50% 0%, 100% 40%, 0 0, 100% 100%, 0 100%);
                &:hover {
                    clip-path: circle(60%);
                    }
                }

                &.clip2 {
                    clip-path: polygon(0% 20%, 60% 20%, 60% 0%, 100% 50%, 60% 100%, 60% 80%, 0% 80%);
                    &:hover {
                        clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%);
                    }
                }
            }
        }
    </style>
</head>

<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg>
    </a>
    <main>
        <header>
            <h1 class="mainmenu">32-Clip-Path</h1>
            <h4>Property that creates a clipping region defining which parts of an element are visible (using shapes like circle(), polygon(), or SVG paths).</h4>
        </header>
        <section>
            <h4>Example 01</h4>
            <div class="clip clip1"></div>
            <h4>Example 02</h4>
            <div class="clip clip2"></div>
        </section>
    </main>
</body>

</html>
