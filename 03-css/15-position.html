<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15-Position</title>
    <link rel="stylesheet" href="../src/css/master.css">

    <style>
        div.box {
            border: 2px solid #fff9;
            border-radius: 4px;
            height: 150px;
            margin-bottom: 2rem;

            &.box1 {
                position: static;
                background-color: rebeccapurple;
            }

            &.box2 {
                position: relative;
                left: 100px;
                background-color: tomato;
            }

            &.box3 {
                position: absolute;
                right: 30px;
                top: 30px;
                width: 200px;
                height: 100px;
                background-color: royalblue;
            }

            &.box4 {
                position: fixed;
                right: 20px;
                bottom: 20px;
                width: 120px;
                height: 80px;
                background-color: orange;
            }

            &.box5 {
                position: sticky;
                top: 0;
                background-color: limegreen;
            }
        }

        div.absolute {
            position: relative;
            height: 220px;
            border: 2px solid #fff9;
            margin-bottom: 2rem;
        }

        div.sticky {
            height: 250px;
            overflow: auto;
            border: 2px solid #fff9;
        }

        div.sticky p {
            height: 500px;
        }
    </style>
</head>

<body class="css">

    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg>
    </a>

    <main>

        <header>
            <h1 class="mainmenu">15-Position</h1>
            <h4>
                - Normal/Static
                - Relative
                - Absolute
                - Fixed
                - Sticky
            </h4>
        </header>

        <section>

            <h4>Normal / Static</h4>
            <div class="box box1"></div>

            <h4>Relative</h4>
            <div class="box box2"></div>

            <h4>Absolute</h4>
            <div class="absolute">
                <div class="box box3"></div>
            </div>

            <h4>Sticky</h4>
            <div class="sticky">
                <div class="box box5"></div>
                <p>
                    Contenido para hacer scroll y ver el funcionamiento
                    de position sticky.
                </p>
            </div>

            <h4>Fixed</h4>
            <div class="box box4"></div>

        </section>

    </main>

</body>

</html>
