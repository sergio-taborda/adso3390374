<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14-background</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        div.box {
            border: 2px solid #fff9;
            border-radius: 4px;
            height: 300px;
            &.box1 {
                background-color: rebeccapurple;
            }
            &.box2 {
                background-image: url(imgs/mario.png);
                background-size: 76px;
            }
            &.box3 {
                background-image: url(imgs/mario.png);
                background-size: 76px;
                background-repeat: repeat-x;
            }
            &.box4 {
                background-image: url(imgs/mario.png);
                background-size: 76px;
                background-repeat: no-repeat;
                background-position: center;
            }
            &.box5 {
                background-image: url(imgs/mario.png);
                background-repeat: no-repeat;
                background-position: center;
                background-size: contain;
            }
            &.box6 {
                background-image: url(imgs/mario.png);
                background-size: 40px;
                background-attachment: fixed;
                margin-bottom: 12rem;
            }
        }
    </style>
</head>
<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
    </a>
    <main>
        <header>
            <h1>14-background</h1>
            <h4>
                <li>background-color</li>
                <li>background-image</li>
                <li>background-repeat</li>
                <li>background-position</li>
                <li>background-size</li>
</h4>
        </header>

        <section>
            <h4>background color</H4>
            <div class="box box1"></div>
            <h4>background image</h4>
            <div class="box box2"></div>
            <h4>background repeat</h4>
            <div class="box box3"></div>
            <h4>background position</h4>
            <div class="box box4"></div>
            <h4>background size</h4>
            <div class="box box5"></div>
            <h4>background attachment</h4>
            <div class="box box6"></div>
        </section>

    </main>
</body>
</html>
