<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>45-Challenge Grid</title>
    <link rel="stylesheet" href="../src/css/master.css" />
    <style>
      img {
        width: 100%;
        height: 100%;
      }

      .wrapper {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 200px 200px 200px;
        grid-gap: 10px;
        min-height: 100vh;
      }

      .div1 {
        grid-column-start: 1;
        grid-column-end: 2;
      }

      .div2 {
        grid-column-start: 2;
        grid-column-end: 3;
        grid-row-start: 1;
        grid-row-end: 3;
      }

      .div3 {
        grid-column-start: 3;
        grid-column-end: 4;
      }

      .div4 {
        grid-column-start: 1;
        grid-column-end: 2;
      }

      .div5 {
        grid-column-start: 3;
        grid-column-end: 4;
      }

      .div6 {
        grid-column-start: 1;
        grid-column-end: 3;
      }

      .div7 {
        grid-column-start: 3;
        grid-column-end: 4;
      }

      .wrapper2 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        grid-template-rows: 200px 200px 200px;
        grid-gap: 10px;
        min-height: 100vh;
      }

      .div8 {
        grid-column-start: 1;
        grid-column-end: 3;
        grid-row-start: 1;
        grid-row-end: 3;
      }

      .div9 {
        grid-column-start: 3;
        grid-column-end: 4;
      }

      .div10 {
        grid-column-start: 4;
        grid-column-end: 5;
      }

      .div11 {
        grid-column-start: 1;
        grid-column-end: 2;
      }

      .div12 {
        grid-column-start: 2;
        grid-column-end: 3;
      }

      .div13 {
        grid-column-start: 3;
        grid-column-end: 5;
        grid-row-start: 2;
        grid-row-end: 4;
      }

      .wrapper * {
        background: #4875b4;
        color: #c5d0e6;
        font-family: Arial;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 1px;
        margin-right: 1px;
      }
    </style>
  </head>

  <body class="css">
    <a href="index.html" class="btn-home">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="32"
        height="32"
        fill="#000000"
        viewBox="0 0 256 256"
      >
        <path
          d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"
        ></path>
      </svg>
    </a>
    <main>
      <header>
        <h1 class="mainmenu">45-Challenge Grid</h1>
        <h4>
          Practical exercise building a dynamic, irregular image gallery layout
          utilizing CSS Grid spanning properties (grid-column, grid-row).
        </h4>
      </header>
      <section>
        <div class="wrapper">
          <div class="div1">
            <img src="imgs/V1.jpg" />
          </div>

          <div class="div2">
            <img src="imgs/V2.jpg" />
          </div>

          <div class="div3">
            <img src="imgs/V3.jpg" />
          </div>

          <div class="div4">
            <img src="imgs/V4.jpg" />
          </div>

          <div class="div5">
            <img src="imgs/V5.jpg" />
          </div>

          <div class="div6">
            <img src="imgs/V6.jpg" />
          </div>

          <div class="div7">
            <img src="imgs/S7.jpg" />
          </div>

          <div class="div8">
            <img src="imgs/S8.jpg" />
          </div>

          <div class="div9">
            <img src="imgs/S9.jpg" />
          </div>

          <div class="div10">
            <img src="imgs/S10.jpg" />
          </div>

          <div class="div11">
            <img src="imgs/S11.jpg" />
          </div>

          <div class="div12">
            <img src="imgs/S12.jpg" />
          </div>

          <div class="div13">
            <img src="imgs/S13.jpg" />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
