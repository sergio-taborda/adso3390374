<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>45-Challenge Grid</title>
    <link rel="stylesheet" href="../src/css/master.css" />

    <style>
      * {
        box-sizing: border-box;
      }

      section {
        width: 777px;
        max-width: 1400px;
        margin: 20px auto;
        padding: 20px;
        background: rgba(0, 0, 0, 0.75);
      }

      .wrapper {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        grid-gap: 10px;
        min-height: 100vh;
        width: 100%;
      }

      .wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 12px;
        border: 4px solid white;
      }

      .img1 {
        grid-column: 1;
        grid-row: 1;
      }

      .img2 {
        grid-column: 2;
        grid-row: 1 / 3;
      }

      .img3 {
        grid-column: 3;
        grid-row: 1;
      }

      .img4 {
        grid-column: 1;
        grid-row: 2;
      }

      .img5 {
        grid-column: 3;
        grid-row: 2;
      }

      .img6 {
        grid-column: 1 / 3;
        grid-row: 3;
      }

      .img7 {
        grid-column: 3;
        grid-row: 3;
      }

      .wrapper2 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(3, 1fr);
        grid-gap: 8px;
        min-height: 600px;
        width: 100%;
      }

      .wrapper2 img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 12px;
        border: 4px solid white;
      }

      .img8 {
        grid-column: 1 / 3;
        grid-row: 1 / 3;
      }

      .img9 {
        grid-column: 3;
        grid-row: 1;
      }

      .img10 {
        grid-column: 4;
        grid-row: 1;
      }

      .img11 {
        grid-column: 3 / 5;
        grid-row: 2 / 4;
      }

      .img12 {
        grid-column: 1;
        grid-row: 3;
      }

      .img13 {
        grid-column: 2;
        grid-row: 3;
      }
    </style>
  </head>

  <body class="css">
    <a href="index.html" class="btn-home">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="32"
        height="32"
        fill="#000000"
        viewBox="0 0 256 256"
      >
        <path
          d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"
        ></path>
      </svg>
    </a>

    <main>
      <header>
        <h1 class="mainmenu">45-Challenge Grid</h1>
        <h4>
          Practical exercise building a dynamic, irregular image gallery layout
          utilizing CSS Grid spanning properties (grid-column, grid-row).
        </h4>
      </header>

      <section>
        <div class="wrapper">
          <img class="img1" src="imgs/V1.jpg" />
          <img class="img2" src="imgs/V2.jpg" />
          <img class="img3" src="imgs/V3.jpg" />
          <img class="img4" src="imgs/V4.jpg" />
          <img class="img5" src="imgs/V5.jpg" />
          <img class="img6" src="imgs/V6.jpg" />
          <img class="img7" src="imgs/S7.jpg" />
        </div>

        <div class="wrapper2">
          <img class="img8" src="imgs/S8.jpg" />
          <img class="img9" src="imgs/S9.jpg" />
          <img class="img10" src="imgs/S10.jpg" />
          <img class="img11" src="imgs/S11.jpg" />
          <img class="img12" src="imgs/S12.jpg" />
          <img class="img13" src="imgs/S13.jpg" />
        </div>
      </section>
    </main>
  </body>
</html>
