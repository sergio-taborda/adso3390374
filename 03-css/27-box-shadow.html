<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>27-Box-Shadow</title>
    <link rel="stylesheet" href="../src/css/master.css" />
    <style>
        section {
            div.box {
                border: 2px solid #fff;
                height: 160px;
                margin: 2rem auto;
                width: 280px;
                &.box1 {
                    box-shadow: 0 0 12px #fff;
                }
                &.box2 {
                    box-shadow: -10px -10px 24px 0 #fff;
                }
                &.box3 {
                    box-shadow: 0 0 20px #fff inset;
                }
                &.box4 {
                box-shadow: 0 0 0 6px yellow,
                12px 12px 0 6px blue, 
                24px 24px 0 6px red;
                }
            }
            div.images {
                text-align: center;
                img {
                    width: 150px;
                    &:first-child { box-shadow: 0 0 18px #fff; }
                    &:last-child { filter: drop-shadow(20px 0 6px #000); }
                }
        }
    }
    </style>
</head>

<body class="css">
    <a href="index.html" class="btn-home">
    <svg
        xmlns="http://www.w3.org/2000/svg"
        width="32"
        height="32"
        fill="#000000"
        viewBox="0 0 256 256"
    >
        <path
        d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"
        ></path>
    </svg>
    </a>
    <main>
    <header>
        <h1 class="mainmenu">27-Box-Shadow</h1>
        <h4>Property defines the shadow of the element.</h4>
    </header>
    <section>
        <h4>box-shadow: 0 0 12px #fff</h4>
        <div class="box box1"></div>
        <h4>box-shadow: -10px -10px 24px 0 #fff</h4>
        <div class="box box2"></div>
        <h4>box-shadow: 0 0 20px #fff inset</h4>
        <div class="box box3"></div>
        <h4>box-shadow: multiple</h4>
        <div class="box box4"></div>
        <h4>box-shadow VS drop-shadow()</h4>
        <div class="images">
        <img src="imgs/mario.png" />
        <img src="imgs/mario.png" />
        </div>
    </section>
    </main>
</body>
</html>
